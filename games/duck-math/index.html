<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duck Math">
<meta name="theme-color" content="#e8f8ff">
<title>Vera's Duck Math</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{
  margin:0;
  font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color:#27323a;
  background:
    radial-gradient(circle at top left,rgba(255,236,153,.55),transparent 30rem),
    linear-gradient(180deg,#e8f8ff 0%,#f7fbef 48%,#fff6dc 100%);
  overflow-x:hidden;
  padding-top:env(safe-area-inset-top);
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
button,a{font:inherit;color:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid #18566f;outline-offset:3px}
.app{width:min(880px,100%);margin:0 auto;padding:12px 14px calc(22px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.home-link{
  color:#47626e;text-decoration:none;font-size:14px;font-weight:800;
  min-height:44px;padding:9px 14px;border-radius:999px;
  background:rgba(255,255,255,.78);border:1px solid rgba(79,126,148,.18);
  display:inline-flex;align-items:center;justify-content:center;
}
.title-block{text-align:center;flex:1;min-width:0}
h1{margin:0;font-size:clamp(22px,5vw,36px);color:#18566f;line-height:1}
.subtitle{margin:4px 0 0;color:#5f7d86;font-size:13px;font-weight:800}
.lede{text-align:center;font-weight:900;color:#18566f;font-size:clamp(18px,4vw,24px);margin:12px 0 0}
.fine{text-align:center;color:#6b8289;font-size:12px;font-weight:800;margin:8px 0 0}
.cabinet{
  position:relative;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.22),transparent 42%),
    linear-gradient(180deg,#1a8aaa 0%,#0f5f78 42%,#0c4c62 100%);
  border-radius:28px;
  padding:12px 12px 14px;
  border:4px solid #f6c431;
  box-shadow:0 12px 0 #c98712,0 22px 36px rgba(24,52,63,.16);
}
.cabinet.is-win{box-shadow:0 12px 0 #c98712,0 0 0 4px #ffe14a,0 22px 36px rgba(245,184,46,.35)}
.cabinet.is-jackpot{box-shadow:0 12px 0 #a87410,0 0 0 5px #ffe14a,0 0 40px rgba(255,225,74,.85)}
.cabinet.is-miss{box-shadow:0 12px 0 #9aa6d0,0 0 0 4px #d5def8,0 22px 36px rgba(80,100,160,.2)}
.cabinet.is-miss::after{
  content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;
  background:radial-gradient(circle at 50% 40%,rgba(228,236,255,.45),transparent 68%);
  animation:veil 1.1s ease forwards;
}
@keyframes veil{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.bulbs{display:flex;justify-content:space-between;gap:4px;padding:0 6px 8px}
.bulb{
  width:12px;height:12px;border-radius:50%;flex:0 0 auto;
  background:var(--c,#ffe14a);
  box-shadow:0 0 8px var(--c,#ffe14a);
  animation:blink 1.15s infinite;
  animation-delay:calc(var(--i) * .08s);
}
.cabinet.is-spin .bulb{animation-duration:.28s}
.cabinet.is-jackpot .bulb{animation-duration:.16s}
@keyframes blink{0%,100%{filter:brightness(1);transform:scale(1)}50%{filter:brightness(.5);transform:scale(.82)}}
.reels{display:grid;grid-template-columns:1fr .68fr 1fr;gap:8px}
.window{
  position:relative;overflow:hidden;height:var(--face,164px);
  background:linear-gradient(180deg,#fff,#fff6dc);
  border-radius:16px;border:3px solid rgba(255,255,255,.75);
  box-shadow:inset 0 8px 14px rgba(24,52,63,.12);
}
.window::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.42),transparent 28%,transparent 72%,rgba(24,52,63,.08));
}
.strip{will-change:transform}
.face{
  height:var(--face,164px);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:2px;padding:2px 2px 4px;text-align:center;
}
.stack{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;width:100%;overflow:hidden}
.opface{justify-content:center}
.opface.plus{background:linear-gradient(180deg,#fff8df,#ffe9a8);color:#5a3d00}
.opface.take{background:linear-gradient(180deg,#f3f6ff,#d5def8);color:#3d4a7a}
.opglyph{font-size:clamp(36px,8vw,60px);font-weight:900;line-height:.9}
.opword{font-size:12px;font-weight:900;line-height:1.05;padding:0 3px}
.flock{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px;max-width:100%}
.flock.lg .duckimg{width:48px;height:48px}
.flock.md .duckimg{width:34px;height:34px}
.flock.sm{width:108px}
.flock.sm .duckimg{width:20px;height:20px}
.flock.misty{
  background:radial-gradient(circle,rgba(185,198,239,.75),rgba(228,236,255,.25) 72%);
  border-radius:14px;padding:3px;filter:blur(.6px);
}
.numeral{font-size:26px;font-weight:900;color:#18566f;line-height:1}
.none{font-size:28px;font-weight:900;color:#8aa0b4}
.caption{margin:8px 0 0;text-align:center;color:#e7f7fb;font-weight:800;font-size:15px;line-height:1.25}
.sumline{
  margin:4px 0 0;text-align:center;font-weight:900;line-height:1;
  font-size:clamp(22px,5vw,34px);color:#fff8dc;text-shadow:0 2px 0 rgba(0,0,0,.18);
}
.sumline.counting{font-size:clamp(30px,7vw,48px)}
.countpond{
  display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px;
  background:linear-gradient(180deg,#fff,#fff6dc);border-radius:16px;
  min-height:var(--face,164px);padding:10px 8px 12px;
}
.cd{position:relative;width:46px;height:46px;display:inline-flex}
.cd .duckimg{width:46px;height:46px}
.cd em{
  position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);
  font-style:normal;font-weight:900;font-size:12px;line-height:1.3;
  background:#fff;color:#18566f;border-radius:99px;min-width:16px;text-align:center;
  box-shadow:0 2px 0 rgba(24,52,63,.12);padding:0 3px;
}
.cd.got{animation:pop .28s ease}
.cd.leaving{animation:blurOut 1s ease forwards}
.zero{font-size:64px;font-weight:900;color:#18566f;width:100%;text-align:center}
@keyframes blurOut{0%{filter:blur(0);opacity:1;transform:scale(1)}100%{filter:blur(14px);opacity:0;transform:scale(1.25)}}
@keyframes streakPop{0%{transform:scale(.55)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes reelSpin{
  0%{transform:translateY(0)}
  78%{transform:translateY(calc(var(--to) - 8px))}
  100%{transform:translateY(var(--to))}
}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.streak{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.88);border:1px solid rgba(79,126,148,.16);
  border-radius:18px;padding:4px 12px 4px 4px;min-height:58px;
}
.streak .duckimg{width:48px;height:48px;display:block}
.streak-num{font-size:32px;font-weight:900;color:#18566f;line-height:1}
.streak-num.pop{animation:streakPop .4s ease}
.streak-num.rest{animation:softRest .8s ease}
@keyframes softRest{0%{filter:none;opacity:1}40%{filter:blur(6px);opacity:.4}100%{filter:none;opacity:1}}
.streak-label{font-size:12px;font-weight:800;color:#5f7d86}
.mult{
  display:inline-block;margin-left:4px;background:#18566f;color:#fff;
  border-radius:999px;padding:2px 7px;font-size:13px;vertical-align:middle;
}
.bank{
  background:linear-gradient(180deg,#ffe777,#f5b82e);color:#5a3d00;
  border-radius:18px;min-height:58px;padding:6px 12px;font-weight:900;
  display:flex;align-items:center;gap:6px;
  box-shadow:0 6px 0 rgba(201,135,18,.35);position:relative;
}
.bank .duckimg{width:34px;height:34px}
.bank b{font-size:26px;line-height:1}
.floater{
  position:absolute;left:50%;top:-6px;transform:translateX(-50%);
  color:#8a5a00;font-weight:900;font-size:20px;pointer-events:none;
  animation:floatUp 1.1s ease forwards;
}
@keyframes floatUp{to{transform:translate(-50%,-28px);opacity:0}}
.goal{min-height:26px;margin:2px 0 8px;text-align:center;font-weight:900;color:#18566f;font-size:16px;line-height:1.25}
.goal.yes,.goal.jack,.goal.soft{background:rgba(255,253,246,.94);border-radius:16px;padding:6px 10px}
.goal.yes{color:#8a5a00}
.goal.jack{color:#8a5a00;font-size:clamp(20px,4.5vw,28px)}
.goal.soft{color:#3d4a7a}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.choice{
  width:100%;min-height:92px;border-radius:22px;font-size:clamp(40px,10vw,64px);font-weight:900;line-height:1;
  box-shadow:0 8px 0 rgba(24,52,63,.14);
}
.choice:active:not(:disabled){transform:translateY(2px)}
.choice.popin{animation:arrive .22s ease both}
@keyframes arrive{from{opacity:.35}to{opacity:1}}
.choice.c0{background:linear-gradient(180deg,#ffe777,#f5b82e);color:#5a3d00}
.choice.c1{background:linear-gradient(180deg,#2f9bb8,#1b7893);color:#fff}
.choice.c2{background:linear-gradient(180deg,#f0917a,#d66c55);color:#fff}
.choice.c3{background:linear-gradient(180deg,#5cb883,#3e9a62);color:#fff}
.choice:disabled{opacity:.45}
.choice.is-yes{
  opacity:1;animation:yesPulse .8s ease infinite;
  box-shadow:0 0 0 4px #fff,0 0 0 8px #ffe14a;
}
.choice.is-mist{
  opacity:.9;filter:blur(1.1px);
  background:linear-gradient(180deg,#e4ecff,#b9c6ef);color:#3d4a7a;
  box-shadow:none;
}
.choice.is-dim{opacity:.32}
@keyframes yesPulse{50%{transform:scale(1.04)}}
.hint{text-align:center;color:#5f7d86;font-weight:800;margin:8px 0 0;font-size:14px}
.go{
  width:100%;min-height:76px;border-radius:22px;margin-top:12px;
  background:linear-gradient(180deg,#ffe777,#f5b82e);color:#5a3d00;
  font-size:32px;font-weight:900;box-shadow:0 8px 0 #c98712;
}
.go:active{transform:translateY(2px);box-shadow:0 5px 0 #c98712}
#again{position:sticky;bottom:8px;z-index:5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.88);border-radius:16px;padding:10px 4px;text-align:center;border:1px solid rgba(79,126,148,.12)}
.stats b{display:block;font-size:28px;color:#18566f;line-height:1}
.stats span{display:block;margin-top:4px;font-size:12px;font-weight:800;color:#5f7d86}
.shelf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.shelf figure{margin:0;width:68px;text-align:center}
.shelf .duckimg{width:52px;height:52px}
.shelf figcaption{font-size:11px;font-weight:800;color:#5f7d86}
.shelf .ghost{opacity:.38}
.quiet{
  display:block;margin:14px auto 0;background:transparent;color:#6b8289;
  font-weight:800;font-size:13px;text-decoration:underline;min-height:44px;padding:8px 12px;
}
.sheet{
  position:fixed;left:0;right:0;top:0;bottom:0;z-index:30;
  background:rgba(24,52,63,.38);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet-card{
  width:min(560px,100%);
  background:#fffdf6;border-radius:24px 24px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 40px rgba(24,52,63,.2);
}
.sheet-card h2{margin:0;color:#18566f;font-size:28px}
.sheet-card p{color:#47626e;font-weight:800;line-height:1.35}
.live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.topbar,.hud,.goal{position:relative;z-index:6}
#fx{position:fixed;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:4;overflow:hidden}
.faller{position:fixed;top:-48px;z-index:4;pointer-events:none;animation:fall linear forwards}
.faller .duckimg{width:34px;height:34px}
.coin{
  width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff6c2,#f5b82e 60%,#c98712);
  box-shadow:0 2px 0 #a87410;
}
@keyframes fall{to{transform:translateY(108vh) rotate(340deg)}}
@media (min-width:720px){
  .answers{grid-template-columns:repeat(4,1fr)}
  .choice{min-height:110px}
  .flock.lg .duckimg{width:72px;height:72px}
  .flock.md .duckimg{width:52px;height:52px}
  .flock.sm{width:180px}
  .flock.sm .duckimg{width:32px;height:32px}
  .cd,.cd .duckimg{width:54px;height:54px}
}
@media (max-height:700px){
  .choice{min-height:76px;font-size:40px}
  .go{min-height:64px;font-size:28px}
}
@media (prefers-reduced-motion:reduce){
  .bulb,.choice.popin,.streak-num.pop,.streak-num.rest,.floater,.cd.got{animation:none !important}
  .cabinet.is-miss::after{animation:none;opacity:0}
}
</style>
</head>
<body>
<div class="app" id="app" data-phase="start">
  <div class="topbar">
    <a class="home-link" href="../../#games">Library</a>
    <div class="title-block">
      <h1>Duck Math</h1>
      <p class="subtitle">Add and take away</p>
    </div>
    <button class="home-link mute" id="mute" type="button" aria-pressed="true">Sound</button>
  </div>

  <section id="start">
    <div class="cabinet" id="startCab">
      <div class="bulbs" id="startBulbs"></div>
      <div class="reels">
        <div class="window" id="startA"></div>
        <div class="window" id="startOp"></div>
        <div class="window" id="startB"></div>
      </div>
      <p class="caption">2 ducks plus 2 ducks</p>
      <p class="sumline">2 + 2 = ?</p>
    </div>
    <p class="lede" id="lede">Spin the ducks. Tap how many.</p>
    <button class="go" id="play" type="button">Spin!</button>
    <div class="stats" aria-label="Saved prizes">
      <div><b id="best">0</b><span>best streak</span></div>
      <div><b id="startBank">0</b><span>golden ducks</span></div>
      <div><b id="hatCount">0</b><span>hats</span></div>
    </div>
    <p class="goal" id="startGoal"></p>
    <div class="shelf" id="startShelf" aria-label="Duck hats"></div>
    <p class="fine">Saved on this device only.</p>
    <button class="quiet" id="reset" type="button">Reset saved prizes</button>
  </section>

  <section id="stage" hidden>
    <div class="hud">
      <div class="streak" aria-live="polite">
        <span id="streakDuck"></span>
        <div>
          <div class="streak-num" id="streakNum">0<span class="mult" id="mult" hidden>×2</span></div>
          <div class="streak-label" id="streakLabel">in a row</div>
        </div>
      </div>
      <button class="bank" id="bankBtn" type="button" aria-label="Golden ducks and hats">
        <span id="bankDuck"></span>
        <b id="bankNum">0</b>
      </button>
    </div>
    <p class="goal" id="goal"></p>
    <div class="cabinet" id="cabinet">
      <div class="bulbs" id="playBulbs"></div>
      <div class="reels" id="reels">
        <div class="window"><div class="strip" id="stripA"></div></div>
        <div class="window"><div class="strip" id="stripOp"></div></div>
        <div class="window"><div class="strip" id="stripB"></div></div>
      </div>
      <div class="countpond" id="countpond" hidden></div>
      <p class="caption" id="caption"></p>
      <p class="sumline" id="sumline"></p>
    </div>
    <div class="answers" id="answers" role="group" aria-label="Answers"></div>
    <p class="hint" id="hint" hidden>Count the ducks, then tap a number.</p>
    <button class="go" id="again" type="button" hidden>Spin again</button>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Your ducks</h2>
    <p id="sheetText"></p>
    <div class="shelf" id="sheetShelf"></div>
    <button class="go" id="sheetClose" type="button">Keep spinning</button>
  </div>
</div>
<div class="live" id="live" aria-live="polite"></div>
<div id="fx"></div>

<script>
(function () {
  var KEY = "vera-duck-math-v1";
  var SOUND_KEY = "veraGoldenDuckTracker.sound";
  var JACKPOT = { 5: 8, 10: 12, 20: 25, 30: 40, 40: 55, 50: 80 };
  var TIERS = [
    { id: "pond", name: "Pond", at: 0, mult: 1, body: "#ffd85a", wing: "#f0b62d", stroke: "#c98712" },
    { id: "sparkle", name: "Sparkle", at: 3, mult: 2, body: "#ffe98a", wing: "#ffd24a", stroke: "#e0a800", hat: "sparkle" },
    { id: "sailor", name: "Sailor", at: 5, mult: 2, body: "#9adcf5", wing: "#6ec4ea", stroke: "#1b7893", hat: "sailor" },
    { id: "flower", name: "Flower", at: 8, mult: 3, body: "#ffc2dd", wing: "#f7a4c8", stroke: "#d66c99", hat: "flower" },
    { id: "crown", name: "Crown", at: 12, mult: 3, body: "#ffe08a", wing: "#f5c044", stroke: "#c98712", hat: "crown" },
    { id: "rainbow", name: "Rainbow", at: 16, mult: 4, body: "#fff", wing: "#ffb7d5", stroke: "#7c5cdb", hat: "sparkle", rainbow: true },
    { id: "golden", name: "Golden", at: 20, mult: 5, body: "#ffe14a", wing: "#ffbf1f", stroke: "#c98712", hat: "crown", shine: true },
    { id: "party", name: "Party", at: 30, mult: 6, body: "#d7c6ff", wing: "#c4b0ff", stroke: "#7c5cdb", hat: "party" },
    { id: "star", name: "Star", at: 40, mult: 7, body: "#9cf0d8", wing: "#6ad7c4", stroke: "#1b7893", hat: "star" },
    { id: "legend", name: "Legend", at: 50, mult: 8, body: "#fff6c2", wing: "#ffe14a", stroke: "#e0a800", hat: "legend", shine: true }
  ];
  var BULB_COLORS = ["#ffe14a", "#ff8fb8", "#7ee0c5", "#8fd4f0", "#ffb067", "#fff"];
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var svgN = 1;
  var audioCtx = null;
  var soundOn = true;
  var state = null;
  var phase = "start";
  var problem = null;
  var choices = [];
  var lastKey = "";
  var timers = [];
  var pendingSpin = false;
  var countRun = 0;

  function $(id) { return document.getElementById(id); }

  function rand(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }

  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  function clampInt(n, min, max) {
    n = parseInt(n, 10);
    if (isNaN(n)) return min;
    if (n < min) return min;
    if (n > max) return max;
    return n;
  }

  function fresh() {
    return { best: 0, streak: 0, bank: 0, hats: [], solved: 0, triedSub: false, tried10: false, tried20: false };
  }

  function tierAt(streak) {
    var t = TIERS[0];
    for (var i = 0; i < TIERS.length; i++) {
      if (TIERS[i].at <= streak) t = TIERS[i];
      else break;
    }
    return t;
  }

  function dropStreak(streak) {
    if (streak <= 0) return 0;
    var prev = 0;
    for (var i = 0; i < TIERS.length; i++) {
      if (TIERS[i].at < streak) prev = TIERS[i].at;
      else break;
    }
    return prev;
  }

  function nextGoal(streak) {
    var nextT = null;
    var i;
    for (i = 0; i < TIERS.length; i++) {
      if (TIERS[i].at > streak) { nextT = TIERS[i]; break; }
    }
    var jacks = [5, 10, 20, 30, 40, 50];
    var nextJ = null;
    for (i = 0; i < jacks.length; i++) {
      if (jacks[i] > streak) { nextJ = jacks[i]; break; }
    }
    if (!nextT && !nextJ) return "Legend streak. Keep spinning!";
    var tDist = nextT ? nextT.at - streak : 99;
    var jDist = nextJ ? nextJ - streak : 99;
    if (jDist <= tDist) {
      var left = nextJ - streak;
      return left + " more for a golden jackpot";
    }
    return tDist + " more for " + nextT.name + " ducks";
  }

  function bandFor(streak) {
    if (streak < 5) return { max: 5, sub: 0 };
    if (streak < 10) return { max: 5, sub: 0.3 };
    if (streak < 20) return { max: 10, sub: 0.4 };
    return { max: 20, sub: 0.5 };
  }

  function pick(list) {
    return list[rand(0, list.length - 1)];
  }

  function fromPair(op, pair) {
    return { op: op, a: pair[0], b: pair[1], answer: op === "+" ? pair[0] + pair[1] : pair[0] - pair[1] };
  }

    var a = rand(1, max - 1);
    var b = rand(1, max - a);
    return { op: "+", a: a, b: b, answer: a + b };

    var a = rand(2, max);
    var b = rand(1, a);
    return { op: "-", a: a, b: b, answer: a - b };

  function buildProblem(streak, solved, flags, prevKey) {
    var base = {
      triedSub: !!(flags && flags.triedSub),
      tried10: !!(flags && flags.tried10),
      tried20: !!(flags && flags.tried20)
    };
    var problemOut = null;
    var flagsOut = base;
    var guard;
    for (guard = 0; guard < 16; guard++) {
      var trialFlags = { triedSub: base.triedSub, tried10: base.tried10, tried20: base.tried20 };
      var trial = rollProblem(streak, solved, trialFlags);
      var key = trial.a + trial.op + trial.b;
      if (key !== prevKey || guard === 15) {
        problemOut = trial;
        flagsOut = trialFlags;
        break;
      }
    }
    return { problem: problemOut, flags: flagsOut, key: problemOut.a + problemOut.op + problemOut.b };
  }

  function rollProblem(streak, solved, flagsOut) {
    if (streak === 0 && !solved) {
      return fromPair("+", pick([[1, 1], [1, 2], [2, 1], [2, 2], [1, 3], [3, 1], [2, 3], [3, 2]]));
    }
    var band = bandFor(streak);
    var wantSub = band.sub > 0 && Math.random() < band.sub;
    if (band.max >= 20 && !flagsOut.tried20) {
      flagsOut.tried20 = true;
      if (wantSub) return fromPair("-", pick([[8, 2], [9, 1], [10, 3], [7, 2], [12, 2]]));
      return fromPair("+", pick([[6, 5], [7, 5], [8, 4], [9, 3], [6, 6], [8, 5], [7, 6]]));
    }
    if (band.max >= 10 && band.max < 20 && !flagsOut.tried10) {
      flagsOut.tried10 = true;
      if (wantSub) return fromPair("-", pick([[5, 1], [6, 2], [7, 1], [4, 2], [8, 3]]));
      return fromPair("+", pick([[4, 3], [5, 2], [6, 2], [4, 4], [3, 5], [7, 2], [8, 1], [5, 4], [6, 3]]));
    }
    if (wantSub && !flagsOut.triedSub) {
      flagsOut.triedSub = true;
      return fromPair("-", pick([[2, 1], [3, 1], [3, 2], [4, 1], [5, 1], [4, 2]]));
    }
    if (wantSub) {
      flagsOut.triedSub = true;
      return makeSub(band.max);
    }
    return makeAdd(band.max);
  }

  function makeChoices(answer) {
    var hi = Math.min(20, Math.max(answer + 3, 5));
    var pool = [];
    var n;
    for (n = 0; n <= hi; n++) if (n !== answer) pool.push(n);
    shuffle(pool);
    pool.sort(function (a, b) { return Math.abs(a - answer) - Math.abs(b - answer); });
    var picks = pool.slice(0, 3);
    picks.push(answer);
    return shuffle(picks);
  }

    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.03);
  }

    aHTML += faceHTML(problem.a, tier, false);
    bHTML += faceHTML(problem.b, tier, mist);
    oHTML += opFace(problem.op);
    $("stripA").innerHTML = aHTML;
    $("stripB").innerHTML = bHTML;
    $("stripOp").innerHTML = oHTML;
    $("caption").textContent = captionFor(problem);
    $("sumline").textContent = equationFor(problem, null);
    setGoal(nextGoal(state.streak), "");
    renderChoices("lock");
    var dA = reduceMotion ? 0 : 720;
    var dOp = reduceMotion ? 0 : 940;
    var dB = reduceMotion ? 0 : 1180;
    spinStrip($("stripA"), decoys + 1, dA);
    spinStrip($("stripOp"), decoys + 1, dOp);
    spinStrip($("stripB"), decoys + 1, dB);
    if (!reduceMotion) {
      var ticks = 0;
      var tickTimer = function () {
        if (phase !== "spin") return;
        playTick();
        ticks++;
        if (ticks * 90 < dB) later(tickTimer, 90);
      };
      tickTimer();
      later(playDing, dA);
      later(playDing, dOp);
    }
    later(landed, dB + (reduceMotion ? 20 : 40));
  }

  function landed() {
    if (phase !== "spin") return;
    setPhase("answer");
    setCabinet("");
    playDing();
    renderChoices("play");
    $("live").textContent = captionFor(problem) + ". Tap the answer.";
    var buttons = $("answers").querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) buttons[i].style.animationDelay = (i * 0.04) + "s";
  }

  function choose(n) {
    if (phase !== "answer") return;
    if (isNaN(n)) return;
    initAudio();
    if (n === problem.answer) win();
    else miss(n);
  }

  function cheerText(reward) {
    if (reward.jack && reward.hat) return "Golden jackpot! " + reward.tier.name + " ducks";
    if (reward.jack) return "Golden jackpot!";
    if (reward.hat) return "New hat! " + reward.tier.name + " ducks";
    return "Yes! " + plural(problem.answer, "duck");
  }

  function win() {
    var prev = state.streak;
    state.streak = prev + 1;
    if (state.streak > state.best) state.best = state.streak;
    var reward = rewardFor(prev, state.streak, state.hats);
    state.bank += reward.total;
    if (reward.hat) state.hats.push(reward.hat);
    state.solved += 1;
    save();
    setPhase("celebrate");
    renderChoices("result", problem.answer);
    renderChrome();
    pulse($("streakNum"), "pop");
    floatPlus(reward.total);
    var kind = reward.jack ? "jackpot" : "win";
    setCabinet(kind);
    setGoal(cheerText(reward), reward.jack ? "jack" : "yes");
    $("sumline").textContent = equationFor(problem, problem.answer);
    $("live").textContent = cheerText(reward);
    if (reward.jack) playJackpot();
    else if (reward.hat) playHat();
    else playCorrect();
    if (navigator.vibrate) { try { navigator.vibrate(reward.jack ? [20, 40, 20] : 18); } catch (e) {} }
    shower(reward.jack ? "jackpot" : reward.hat ? "hat" : "win", reward.tier);
    var delay = reward.jack ? 2800 : reward.hat ? 2200 : 1500;
    if (reduceMotion) delay = 700;
    later(function () {
      if (!$("sheet").hidden) { pendingSpin = true; return; }
      spin();
    }, delay);
  }

  function miss(pick) {
    var prev = state.streak;
    var rested = dropStreak(prev);
    state.streak = rested;
    save();
    setPhase("count");
    renderChoices("result", pick);
    renderChrome();
    if (rested !== prev) pulse($("streakNum"), "rest");
    setCabinet("miss");
    playPoof();
    var note = rested !== prev ? " Streak rests at " + rested + "." : "";
    setGoal("Let's count." + note, "soft");
    $("live").textContent = "Let's count. " + plural(problem.answer, "duck") + "." + note;
    $("again").hidden = false;
    $("reels").hidden = true;
    $("countpond").hidden = false;
    $("sumline").className = "sumline counting";
    $("sumline").textContent = equationFor(problem, "\u2026");
    runCount();
  }

  function runCount() {
    var run = countRun;
    var tier = problem.tier;
    var pond = $("countpond");
    var shown = problem.op === "+" ? problem.answer : problem.a;
    if (shown <= 0) {
      pond.innerHTML = '<div class="zero">0</div>';
      finishCount(run);
      return;
    }
    var html = "";
    var i;
    for (i = 0; i < shown; i++) html += '<span class="cd">' + duckSVG(tier) + "</span>";
    pond.innerHTML = html;
    var nodes = pond.querySelectorAll(".cd");
    var step = reduceMotion ? 0 : (problem.answer > 12 ? 130 : 220);

    function mark(index, num) {
      var el = nodes[index];
      if (!el) return;
      el.className = "cd got";
      el.innerHTML = duckSVG(tier) + "<em>" + num + "</em>";
    }

    function numberThem() {
      if (countRun !== run || phase !== "count") return;
      if (problem.answer <= 0) {
        pond.innerHTML = '<div class="zero">0</div>';
        $("sumline").textContent = equationFor(problem, 0);
        finishCount(run);
        return;
      }
      if (step === 0) {
        var n;
        for (n = 0; n < problem.answer; n++) mark(n, n + 1);
        finishCount(run);
        return;
      }
      var cursor = 0;
      function one() {
        if (countRun !== run || phase !== "count") return;
        if (cursor >= problem.answer) { finishCount(run); return; }
        mark(cursor, cursor + 1);
        playCountBlip(cursor);
        cursor++;
        later(one, step);
      }
      one();
    }

    if (problem.op === "-") {
      later(function () {
        if (countRun !== run || phase !== "count") return;
        var k;
        for (k = problem.answer; k < nodes.length; k++) {
          if (reduceMotion) nodes[k].style.opacity = "0.2";
          else nodes[k].className = "cd leaving";
        }
        if (problem.b > 0) playPoof();
      }, reduceMotion ? 0 : 420);
      later(numberThem, reduceMotion ? 40 : 1450);
    } else {
      later(numberThem, reduceMotion ? 0 : 180);
    }
  }

  function finishCount(run) {
    if (countRun !== run || phase !== "count") return;
    $("sumline").textContent = equationFor(problem, problem.answer);
    var rested = state.streak;
    var extra = "";
    if ($("goal").textContent.indexOf("rests") !== -1) extra = " Streak rests at " + rested + ".";
    setGoal("That's " + plural(problem.answer, "duck") + "." + extra, "soft");
    $("live").textContent = "That's " + plural(problem.answer, "duck") + "." + extra;
  }

  function floatPlus(n) {
    var el = document.createElement("span");
    el.className = "floater";
    el.textContent = "+" + n;
    $("bankBtn").appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1200);
  }

  function pulse(el, cls) {
    el.classList.remove("pop");
    el.classList.remove("rest");
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function shower(kind, tier) {
    if (reduceMotion) return;
    var ducksN = kind === "jackpot" ? 24 : kind === "hat" ? 14 : 9;
    var coins = kind === "jackpot" ? 18 : kind === "hat" ? 10 : 7;
    var i;
    for (i = 0; i < ducksN; i++) spawnFall(duckSVG(tier), 1.5 + Math.random() * 0.9, Math.random() * 0.35);
    for (i = 0; i < coins; i++) spawnFall('<i class="coin"></i>', 1.3 + Math.random() * 0.8, Math.random() * 0.4);
  }

  function spawnFall(html, dur, delay) {
    var el = document.createElement("div");
    el.className = "faller";
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = dur + "s";
    el.style.animationDelay = delay + "s";
    el.innerHTML = html;
    $("fx").appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, (dur + delay) * 1000 + 200);
  }

  function openSheet() {
    $("sheet").hidden = false;
    renderChrome();
  }

  function closeSheet() {
    $("sheet").hidden = true;
    if (pendingSpin && phase === "celebrate") spin();
  }

  function begin() {
    if (phase === "spin" || phase === "celebrate" || phase === "answer" || phase === "count") return;
    initAudio();
    playTap();
    setPhase("spin");
    $("start").hidden = true;
    $("stage").hidden = false;
    renderChrome();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { spin(); });
    });
  }

  function resetAll() {
    if (!window.confirm("Reset saved streaks, hats, and golden ducks on this device?")) return;
    state = fresh();
    lastKey = "";
    save();
    renderChrome();
    renderStartFaces();
    playTap();
  }

  function closestButton(node) {
    while (node && node !== document) {
      if (node.tagName === "BUTTON") return node;
      node = node.parentNode;
    }
    return null;
  }

  function onResize() {
    applyFace();
    if (phase === "answer" || phase === "celebrate" || phase === "count" || phase === "spin") {
      if (phase !== "spin") snapStrips();
    }
  }

  $("play").addEventListener("click", begin);
  $("again").addEventListener("click", function () {
    if (phase !== "count") return;
    initAudio();
    playTap();
    spin();
  });
  $("answers").addEventListener("click", function (e) {
    var btn = closestButton(e.target);
    if (!btn || btn.disabled) return;
    choose(parseInt(btn.getAttribute("data-n"), 10));
  });
  $("mute").addEventListener("click", function () {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off"); } catch (e) {}
    renderSound();
    if (soundOn) { initAudio(); playTap(); }
  });
  $("bankBtn").addEventListener("click", openSheet);
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) closeSheet(); });
  $("reset").addEventListener("click", resetAll);
  window.addEventListener("resize", onResize);

  try { soundOn = localStorage.getItem(SOUND_KEY) !== "off"; } catch (e2) { soundOn = true; }
  state = load();
  applyFace();
  $("startBulbs").innerHTML = bulbHTML();
  $("playBulbs").innerHTML = bulbHTML();
  renderSound();
  renderStartFaces();
  renderChrome();

  window.DuckMath = {
    buildProblem: buildProblem,
    dropStreak: dropStreak,
    makeChoices: makeChoices,
    bandFor: bandFor,
    tierAt: tierAt,
    nextGoal: nextGoal,
    rewardFor: rewardFor,
    getState: function () {
      return {
        best: state.best, streak: state.streak, bank: state.bank, solved: state.solved,
        hats: state.hats.slice(), triedSub: state.triedSub, tried10: state.tried10, tried20: state.tried20
      };
    },
    setState: function (p) {
      if (!p) return;
      if (p.best != null) state.best = p.best;
      if (p.streak != null) state.streak = p.streak;
      if (p.bank != null) state.bank = p.bank;
      if (p.solved != null) state.solved = p.solved;
      if (p.hats) state.hats = p.hats.slice();
      if (p.triedSub != null) state.triedSub = !!p.triedSub;
      if (p.tried10 != null) state.tried10 = !!p.tried10;
      if (p.tried20 != null) state.tried20 = !!p.tried20;
      if (state.best < state.streak) state.best = state.streak;
      save();
      renderChrome();
      renderStartFaces();
    },
    getPhase: function () { return phase; }
  };
})();
</script>
</body>
</html>
