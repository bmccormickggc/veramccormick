<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duck Math">
<meta name="theme-color" content="#e8f8ff">
<title>Vera's Duck Math</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{
  margin:0;
  font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color:#27323a;
  background:
    radial-gradient(circle at top left,rgba(255,236,153,.55),transparent 30rem),
    linear-gradient(180deg,#e8f8ff 0%,#f7fbef 48%,#fff6dc 100%);
  overflow-x:hidden;
  padding-top:env(safe-area-inset-top);
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
button,a{font:inherit;color:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid #18566f;outline-offset:3px}
.app{width:min(880px,100%);margin:0 auto;padding:12px 14px calc(22px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.home-link{
  color:#47626e;text-decoration:none;font-size:14px;font-weight:800;
  min-height:44px;padding:9px 14px;border-radius:999px;
  background:rgba(255,255,255,.78);border:1px solid rgba(79,126,148,.18);
  display:inline-flex;align-items:center;justify-content:center;
}
.title-block{text-align:center;flex:1;min-width:0}
h1{margin:0;font-size:clamp(22px,5vw,36px);color:#18566f;line-height:1}
.subtitle{margin:4px 0 0;color:#5f7d86;font-size:13px;font-weight:800}
.lede{text-align:center;font-weight:900;color:#18566f;font-size:clamp(18px,4vw,24px);margin:12px 0 0}
.fine{text-align:center;color:#6b8289;font-size:12px;font-weight:800;margin:8px 0 0}
.cabinet{
  position:relative;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,255,.22),transparent 42%),
    linear-gradient(180deg,#1a8aaa 0%,#0f5f78 42%,#0c4c62 100%);
  border-radius:28px;
  padding:12px 12px 14px;
  border:4px solid #f6c431;
  box-shadow:0 12px 0 #c98712,0 22px 36px rgba(24,52,63,.16);
}
.cabinet.is-win{box-shadow:0 12px 0 #c98712,0 0 0 4px #ffe14a,0 22px 36px rgba(245,184,46,.35)}
.cabinet.is-jackpot{box-shadow:0 12px 0 #a87410,0 0 0 5px #ffe14a,0 0 40px rgba(255,225,74,.85)}
.cabinet.is-miss{box-shadow:0 12px 0 #9aa6d0,0 0 0 4px #d5def8,0 22px 36px rgba(80,100,160,.2)}
.cabinet.is-miss::after{
  content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;
  background:radial-gradient(circle at 50% 40%,rgba(228,236,255,.45),transparent 68%);
  animation:veil 1.1s ease forwards;
}
@keyframes veil{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.bulbs{display:flex;justify-content:space-between;gap:4px;padding:0 6px 8px}
.bulb{
  width:12px;height:12px;border-radius:50%;flex:0 0 auto;
  background:var(--c,#ffe14a);
  box-shadow:0 0 8px var(--c,#ffe14a);
  animation:blink 1.15s infinite;
  animation-delay:calc(var(--i) * .08s);
}
.cabinet.is-spin .bulb{animation-duration:.28s}
.cabinet.is-jackpot .bulb{animation-duration:.16s}
@keyframes blink{0%,100%{filter:brightness(1);transform:scale(1)}50%{filter:brightness(.5);transform:scale(.82)}}
.reels{display:grid;grid-template-columns:1fr .68fr 1fr;gap:8px}
.window{
  position:relative;overflow:hidden;height:var(--face,164px);
  background:linear-gradient(180deg,#fff,#fff6dc);
  border-radius:16px;border:3px solid rgba(255,255,255,.75);
  box-shadow:inset 0 8px 14px rgba(24,52,63,.12);
}
.window::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.42),transparent 28%,transparent 72%,rgba(24,52,63,.08));
}
.strip{will-change:transform}
.face{
  height:var(--face,164px);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:2px;padding:2px 2px 4px;text-align:center;
}
.stack{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;width:100%;overflow:hidden}
.opface{justify-content:center}
.opface.plus{background:linear-gradient(180deg,#fff8df,#ffe9a8);color:#5a3d00}
.opface.take{background:linear-gradient(180deg,#f3f6ff,#d5def8);color:#3d4a7a}
.opglyph{font-size:clamp(36px,8vw,60px);font-weight:900;line-height:.9}
.opword{font-size:12px;font-weight:900;line-height:1.05;padding:0 3px}
.flock{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:2px;max-width:100%}
.flock.lg .duckimg{width:48px;height:48px}
.flock.md .duckimg{width:34px;height:34px}
.flock.sm{width:108px}
.flock.sm .duckimg{width:20px;height:20px}
.flock.misty{
  background:radial-gradient(circle,rgba(185,198,239,.75),rgba(228,236,255,.25) 72%);
  border-radius:14px;padding:3px;filter:blur(.6px);
}
.numeral{font-size:26px;font-weight:900;color:#18566f;line-height:1}
.none{font-size:28px;font-weight:900;color:#8aa0b4}
.caption{margin:8px 0 0;text-align:center;color:#e7f7fb;font-weight:800;font-size:15px;line-height:1.25}
.sumline{
  margin:4px 0 0;text-align:center;font-weight:900;line-height:1;
  font-size:clamp(22px,5vw,34px);color:#fff8dc;text-shadow:0 2px 0 rgba(0,0,0,.18);
}
.sumline.counting{font-size:clamp(30px,7vw,48px)}
.countpond{
  display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px;
  background:linear-gradient(180deg,#fff,#fff6dc);border-radius:16px;
  min-height:var(--face,164px);padding:10px 8px 12px;
}
.cd{position:relative;width:46px;height:46px;display:inline-flex}
.cd .duckimg{width:46px;height:46px}
.cd em{
  position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);
  font-style:normal;font-weight:900;font-size:12px;line-height:1.3;
  background:#fff;color:#18566f;border-radius:99px;min-width:16px;text-align:center;
  box-shadow:0 2px 0 rgba(24,52,63,.12);padding:0 3px;
}
.cd.got{animation:pop .28s ease}
.cd.leaving{animation:blurOut 1s ease forwards}
.zero{font-size:64px;font-weight:900;color:#18566f;width:100%;text-align:center}
@keyframes blurOut{0%{filter:blur(0);opacity:1;transform:scale(1)}100%{filter:blur(14px);opacity:0;transform:scale(1.25)}}
@keyframes streakPop{0%{transform:scale(.55)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes reelSpin{
  0%{transform:translateY(0)}
  78%{transform:translateY(calc(var(--to) - 8px))}
  100%{transform:translateY(var(--to))}
}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.streak{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.88);border:1px solid rgba(79,126,148,.16);
  border-radius:18px;padding:4px 12px 4px 4px;min-height:58px;
}
.streak .duckimg{width:48px;height:48px;display:block}
.streak-num{font-size:32px;font-weight:900;color:#18566f;line-height:1}
.streak-num.pop{animation:streakPop .4s ease}
.streak-num.rest{animation:softRest .8s ease}
@keyframes softRest{0%{filter:none;opacity:1}40%{filter:blur(6px);opacity:.4}100%{filter:none;opacity:1}}
.streak-label{font-size:12px;font-weight:800;color:#5f7d86}
.mult{
  display:inline-block;margin-left:4px;background:#18566f;color:#fff;
  border-radius:999px;padding:2px 7px;font-size:13px;vertical-align:middle;
}
.bank{
  background:linear-gradient(180deg,#ffe777,#f5b82e);color:#5a3d00;
  border-radius:18px;min-height:58px;padding:6px 12px;font-weight:900;
  display:flex;align-items:center;gap:6px;
  box-shadow:0 6px 0 rgba(201,135,18,.35);position:relative;
}
.bank .duckimg{width:34px;height:34px}
.bank b{font-size:26px;line-height:1}
.floater{
  position:absolute;left:50%;top:-6px;transform:translateX(-50%);
  color:#8a5a00;font-weight:900;font-size:20px;pointer-events:none;
  animation:floatUp 1.1s ease forwards;
}
@keyframes floatUp{to{transform:translate(-50%,-28px);opacity:0}}
.goal{min-height:26px;margin:2px 0 8px;text-align:center;font-weight:900;color:#18566f;font-size:16px;line-height:1.25}
.goal.yes,.goal.jack,.goal.soft{background:rgba(255,253,246,.94);border-radius:16px;padding:6px 10px}
.goal.yes{color:#8a5a00}
.goal.jack{color:#8a5a00;font-size:clamp(20px,4.5vw,28px)}
.goal.soft{color:#3d4a7a}
.answers{display:grid;gap:12px;margin-top:12px}
.answers.n3{grid-template-columns:repeat(3,1fr)}
.answers.n4{grid-template-columns:1fr 1fr}
.reels.single{grid-template-columns:1fr}
.wideface{justify-content:center}
.eq{display:flex;align-items:center;justify-content:center;width:100%;gap:2px}
.side{width:44%;display:flex;flex-direction:column;align-items:center;gap:2px}
.side .flock{flex-wrap:nowrap}
.plusmark{font-size:clamp(32px,8vw,48px);font-weight:900;color:#5a3d00;line-height:1}
.duckbtn{position:relative;display:inline-flex;padding:0;background:transparent;border-radius:14px;line-height:0}
.duckbtn .duckimg{width:100%;height:100%;display:block}
.flock.lg .duckbtn{width:56px;height:56px}
.flock.md .duckbtn{width:46px;height:46px}
.flock.sm .duckbtn{width:36px;height:36px}
.flock.xs .duckbtn{width:30px;height:30px}
.duckbtn.lit{background:radial-gradient(circle,rgba(255,225,74,.9),rgba(255,225,74,.25) 68%,transparent 72%)}
.duckbtn em{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  font-style:normal;font-weight:900;font-size:13px;line-height:1.25;
  background:#fff;color:#18566f;border-radius:99px;min-width:16px;text-align:center;
  box-shadow:0 1px 0 rgba(24,52,63,.16);padding:0 3px;
}
.pond{
  position:relative;overflow:hidden;min-height:156px;
  background:linear-gradient(180deg,#e7f7ff 0%,#fff 58%,#fff6dc 100%);
  border-radius:16px;border:3px solid rgba(255,255,255,.8);
  box-shadow:inset 0 8px 14px rgba(24,52,63,.08);
  padding:14px 8px 12px;
}
.pond-ducks{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:6px;min-height:112px}
.pond .duckbtn{width:62px;height:62px}
.duckbtn.bob{animation:bob 1.5s ease-in-out infinite}
.duckbtn.bob:nth-child(2n){animation-delay:.22s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.duckbtn.swimaway{animation:swimAway 1.05s ease forwards;pointer-events:none}
@keyframes swimAway{
  0%{transform:translateY(0) scale(1);filter:none;opacity:1}
  40%{transform:translateY(-16px) scale(1.08);filter:blur(7px);opacity:.45}
  100%{transform:translateY(-46px) scale(1.18);filter:blur(16px);opacity:0}
}
.duckbtn.gone{display:none}
.ripples{position:absolute;left:8%;right:8%;bottom:10px;height:14px;z-index:0;pointer-events:none}
.ripples i{position:absolute;height:8px;border-radius:50%;background:rgba(27,120,147,.18)}
.ripples i:nth-child(1){left:6%;width:28%}
.ripples i:nth-child(2){left:38%;width:22%;bottom:4px}
.ripples i:nth-child(3){right:8%;width:26%}
.recount{
  display:block;margin:8px auto 0;background:transparent;color:#18566f;
  font-weight:800;font-size:15px;min-height:44px;text-decoration:underline;
}
.level-note{text-align:center;color:#5f7d86;font-size:13px;font-weight:800;margin:8px 0 0;line-height:1.35}
.caption.ask{font-size:18px;color:#fff}
.choice{
  width:100%;min-height:92px;border-radius:22px;font-size:clamp(40px,10vw,64px);font-weight:900;line-height:1;
  box-shadow:0 8px 0 rgba(24,52,63,.14);
}
.choice:active:not(:disabled){transform:translateY(2px)}
.choice.popin{animation:arrive .22s ease both}
@keyframes arrive{from{opacity:.35}to{opacity:1}}
.choice.c0{background:linear-gradient(180deg,#ffe777,#f5b82e);color:#5a3d00}
.choice.c1{background:linear-gradient(180deg,#2f9bb8,#1b7893);color:#fff}
.choice.c2{background:linear-gradient(180deg,#f0917a,#d66c55);color:#fff}
.choice.c3{background:linear-gradient(180deg,#5cb883,#3e9a62);color:#fff}
.choice:disabled{opacity:.45}
.choice.is-yes{
  opacity:1;animation:yesPulse .8s ease infinite;
  box-shadow:0 0 0 4px #fff,0 0 0 8px #ffe14a;
}
.choice.is-mist{
  opacity:.9;filter:blur(1.1px);
  background:linear-gradient(180deg,#e4ecff,#b9c6ef);color:#3d4a7a;
  box-shadow:none;
}
.choice.is-dim{opacity:.32}
@keyframes yesPulse{50%{transform:scale(1.04)}}
.hint{text-align:center;color:#5f7d86;font-weight:800;margin:8px 0 0;font-size:14px}
.go{
  width:100%;min-height:76px;border-radius:22px;margin-top:12px;
  background:linear-gradient(180deg,#ffe777,#f5b82e);color:#5a3d00;
  font-size:32px;font-weight:900;box-shadow:0 8px 0 #c98712;
}
.go:active{transform:translateY(2px);box-shadow:0 5px 0 #c98712}
#again{position:sticky;bottom:8px;z-index:5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.88);border-radius:16px;padding:10px 4px;text-align:center;border:1px solid rgba(79,126,148,.12)}
.stats b{display:block;font-size:28px;color:#18566f;line-height:1}
.stats span{display:block;margin-top:4px;font-size:12px;font-weight:800;color:#5f7d86}
.shelf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.shelf figure{margin:0;width:68px;text-align:center}
.shelf .duckimg{width:52px;height:52px}
.shelf figcaption{font-size:11px;font-weight:800;color:#5f7d86}
.shelf .ghost{opacity:.38}
.quiet{
  display:block;margin:14px auto 0;background:transparent;color:#6b8289;
  font-weight:800;font-size:13px;text-decoration:underline;min-height:44px;padding:8px 12px;
}
.sheet{
  position:fixed;left:0;right:0;top:0;bottom:0;z-index:30;
  background:rgba(24,52,63,.38);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet-card{
  width:min(560px,100%);
  background:#fffdf6;border-radius:24px 24px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 40px rgba(24,52,63,.2);
}
.sheet-card h2{margin:0;color:#18566f;font-size:28px}
.sheet-card p{color:#47626e;font-weight:800;line-height:1.35}
.live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.topbar,.hud,.goal{position:relative;z-index:6}
#fx{position:fixed;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:4;overflow:hidden}
.faller{position:fixed;top:-48px;z-index:4;pointer-events:none;animation:fall linear forwards}
.faller .duckimg{width:34px;height:34px}
.coin{
  width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff6c2,#f5b82e 60%,#c98712);
  box-shadow:0 2px 0 #a87410;
}
@keyframes fall{to{transform:translateY(108vh) rotate(340deg)}}
@media (min-width:720px){
  .answers.n4{grid-template-columns:repeat(4,1fr)}
  .choice{min-height:110px}
  .flock.lg .duckimg,.flock.lg .duckbtn{width:72px;height:72px}
  .flock.md .duckimg,.flock.md .duckbtn{width:56px;height:56px}
  .flock.sm .duckimg,.flock.sm .duckbtn{width:44px;height:44px}
  .flock.xs .duckimg,.flock.xs .duckbtn{width:36px;height:36px}
  .pond .duckbtn{width:76px;height:76px}
  .cd,.cd .duckimg{width:54px;height:54px}
}
@media (max-height:700px){
  .choice{min-height:76px;font-size:40px}
  .go{min-height:64px;font-size:28px}
}
@media (prefers-reduced-motion:reduce){
  .bulb,.choice.popin,.streak-num.pop,.streak-num.rest,.floater,.cd.got,.duckbtn.bob{animation:none !important}
  .cabinet.is-miss::after{animation:none;opacity:0}
  .duckbtn.swimaway{animation:none !important;opacity:.2;filter:blur(8px)}
}
</style>
</head>
<body>
<div class="app" id="app" data-phase="start">
  <div class="topbar">
    <a class="home-link" href="../../#games">Library</a>
    <div class="title-block">
      <h1>Duck Math</h1>
      <p class="subtitle">Add and take away</p>
    </div>
    <button class="home-link mute" id="mute" type="button" aria-pressed="true">Sound</button>
  </div>

  <section id="start">
    <div class="cabinet" id="startCab">
      <div class="bulbs" id="startBulbs"></div>
      <div class="reels">
        <div class="window" id="startA"></div>
        <div class="window" id="startOp"></div>
        <div class="window" id="startB"></div>
      </div>
      <p class="caption">2 ducks plus 2 ducks</p>
      <p class="sumline">2 + 2 = ?</p>
    </div>
    <p class="lede" id="lede">Spin the ducks. Tap how many.</p>
    <button class="go" id="play" type="button">Spin!</button>
    <div class="stats" aria-label="Saved prizes">
      <div><b id="best">0</b><span>best streak</span></div>
      <div><b id="startBank">0</b><span>golden ducks</span></div>
      <div><b id="hatCount">0</b><span>hats</span></div>
    </div>
    <p class="goal" id="startGoal"></p>
    <div class="shelf" id="startShelf" aria-label="Duck hats"></div>
    <p class="level-note" id="levelNote"></p>
    <p class="fine">Saved on this device only.</p>
    <button class="quiet" id="reset" type="button">Reset saved prizes</button>
  </section>

  <section id="stage" hidden>
    <div class="hud">
      <div class="streak" aria-live="polite">
        <span id="streakDuck"></span>
        <div>
          <div class="streak-num" id="streakNum">0<span class="mult" id="mult" hidden>×2</span></div>
          <div class="streak-label" id="streakLabel">in a row</div>
        </div>
      </div>
      <button class="bank" id="bankBtn" type="button" aria-label="Golden ducks and hats">
        <span id="bankDuck"></span>
        <b id="bankNum">0</b>
      </button>
    </div>
    <p class="goal" id="goal"></p>
    <div class="cabinet" id="cabinet">
      <div class="bulbs" id="playBulbs"></div>
      <div class="reels single" id="reels">
        <div class="window wide"><div class="strip" id="stripAdd"></div></div>
      </div>
      <div class="pond" id="pond" hidden>
        <div class="ripples" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="pond-ducks" id="pondDucks"></div>
      </div>
      <div class="countpond" id="countpond" hidden></div>
      <p class="caption" id="caption"></p>
      <p class="sumline" id="sumline"></p>
    </div>
    <div class="answers" id="answers" role="group" aria-label="Answers"></div>
    <p class="hint" id="hint" hidden>Tap each duck to count, then tap the number.</p>
    <button class="recount" id="recount" type="button" hidden>Count again</button>
    <button class="go" id="again" type="button" hidden>Spin again</button>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Your ducks</h2>
    <p id="sheetText"></p>
    <div class="shelf" id="sheetShelf"></div>
    <button class="go" id="sheetClose" type="button">Keep spinning</button>
  </div>
</div>
<div class="live" id="live" aria-live="polite"></div>
<div id="fx"></div>

<script>
(function () {
  var KEY = "vera-duck-math-v2";
  var OLD_KEY = "vera-duck-math-v1";
  var SOUND_KEY = "veraGoldenDuckTracker.sound";
  // Adaptive rule:
  // Target about 95% correct in a rolling window of the last 20 answers.
  // That is not a 10% miss rate. The 10-12% figure is the skill stretch:
  // each level adds one to the max sum or one new number (a single extra duck).
  // From sums around 8 upward, +1 is about a 10-12% stretch. Earlier, +1 duck
  // is the smallest step. Step up only at or above 95% and without hesitation.
  // Step down after 2 misses in a short span, or 3 slow answers. One miss
  // does not change the level. Streaks and jackpots never change the math.
  // A new sitting starts one step below the saved level.
  var ADAPT_WINDOW = 20;
  var ADAPT_TARGET = 0.95;
  var ADAPT_MIN_SAMPLES = 16;
  var ADAPT_MISS_SPAN = 5;
  var ADAPT_MISS_DROP = 2;

  function duckSVG(tier) {

    var body = tier.body;
    var defs = "";
    if (tier.rainbow) {
      defs = '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="#ff8b8b"/><stop offset=".35" stop-color="#ffd15c"/>' +
        '<stop offset=".62" stop-color="#7dcea0"/><stop offset="1" stop-color="#7eb6ff"/></linearGradient></defs>';
      body = "url(#" + id + ")";
    }
    var shine = tier.shine ? '<ellipse cx="30" cy="40" rx="7" ry="3.4" fill="#fff" opacity=".5"/>' : "";
    return '<svg class="duckimg" viewBox="0 0 64 64" aria-hidden="true">' + defs +
      '<path d="M17 39c1.8-9.8 11.3-17 22-14.2 7.3 1.9 12.9 7.9 14.1 15.4.6 3.8-2.3 7.3-6.1 7.3H23.2c-4 0-7-3.8-6.2-8.5Z" fill="' + body + '" stroke="' + tier.stroke + '" stroke-width="1"/>' +
      shine +
      '<path d="M12.3 35.2c-2.6-2.7-3.2-6.5-1.3-8.8 2.1-2.5 6.5-1.8 9.4 1.4l7.4 8.1-10.1 5-5.4-5.7Z" fill="' + tier.wing + '"/>' +
      '<path d="M32.8 21.2c0-7.2 5.2-12.7 12.2-12.7 6.7 0 11.8 4.9 11.8 11.4 0 6.1-4.8 10.8-11.1 10.8h-8.5c-2.5 0-4.4-1.9-4.4-4.3v-5.2Z" fill="' + body + '" stroke="' + tier.stroke + '" stroke-width="1"/>' +
      hatSVG(tier.hat) +
      '<path d="M55.4 19.1h7.1c1.1 0 1.7 1.4.9 2.2l-5 4.9c-.8.8-2.2.5-2.7-.5l-2.1-4.4c-.5-1.1.3-2.2 1.8-2.2Z" fill="#f58528"/>' +
      '<circle cx="47.7" cy="17.7" r="2.3" fill="#25323a"/>' +
      '<path d="M25 43.6c5 3.1 15.3 3.2 22-.6" fill="none" stroke="' + tier.stroke + '" stroke-width="2.4" stroke-linecap="round"/>' +
      '</svg>';
  }

  function ducks(n, tier) {
    var html = "";
    for (var i = 0; i < n; i++) html += duckSVG(tier);
    return html;
  }

  function sizeClass(n) {
    if (n <= 2) return "lg";
    if (n === 3) return "md";
    if (n === 4) return "sm";
    return "xs";
  }

  function duckButtons(n, tier, tappable) {
    var html = "";
    var i;
    for (i = 0; i < n; i++) {
      if (tappable) html += '<button type="button" class="duckbtn">' + duckSVG(tier) + "</button>";
      else html += duckSVG(tier);
    }
    return html;
  }

  function sideHTML(n, tier, tappable) {
    return '<div class="side"><div class="flock ' + sizeClass(n) + '">' + duckButtons(n, tier, tappable) +
      '</div><div class="numeral">' + n + "</div></div>";
  }

  function wideFace(a, b, tier, tappable) {
    return '<div class="face wideface"><div class="eq">' + sideHTML(a, tier, tappable) +
      '<div class="plusmark">+</div>' + sideHTML(b, tier, tappable) + "</div></div>";
  }

  function faceHTML(count, tier) {
    var size = count <= 3 ? "lg" : count <= 5 ? "md" : "sm";
    return '<div class="face"><div class="stack"><div class="flock ' + size + '">' + ducks(count, tier) +
      '</div></div><div class="numeral">' + count + "</div></div>";
  }

  function opFace(op) {
    if (op === "-") return '<div class="face opface take"><div class="opglyph">&minus;</div><div class="opword">take away</div></div>';
    return '<div class="face opface plus"><div class="opglyph">+</div><div class="opword">plus</div></div>';
  }

  function captionFor(p) {
    if (p.track === "sub") return "How many ducks are left?";
    return plural(p.a, "duck") + " and " + p.b + " more " + (p.b === 1 ? "duck" : "ducks");
  }

  function speechFor(p) {
    if (p.track === "sub") {
      if (p.showMinus) return word(p.a) + " take away " + word(p.b) + ". How many ducks are left?";
      return "How many ducks are left?";
    }
    return word(p.a) + (p.a === 1 ? " duck and " : " ducks and ") + word(p.b) + " more " +
      (p.b === 1 ? "duck" : "ducks") + ". How many ducks?";
  }

  function equationFor(p, result) {
    var shown = result == null ? "?" : result;
    if (p.track === "sub" && !p.showMinus) return shown === "?" ? "?" : String(shown);
    var sym = p.op === "+" ? "+" : "\u2212";
    return p.a + " " + sym + " " + p.b + " = " + shown;
  }

  function levelBlurb() {
    var spec = addSpec(state.addLevel);
    var line = "Sums up to " + spec.maxSum + ". One new duck at a time.";
    if (!state.subUnlocked) return line + " Take-away waits until adding feels easy.";
    var sub = SUB_LADDER[clampInt(state.subLevel, 0, SUB_LADDER.length - 1)];
    return line + " Take-away story: " + sub.from + " ducks, " + sub.take + " swim away.";
  }

  function bulbHTML() {
    var html = "";
    for (var i = 0; i < 12; i++) {
      html += '<i class="bulb" style="--i:' + i + ";--c:" + BULB_COLORS[i % BULB_COLORS.length] + '"></i>';
    }
    return html;
  }

  function facePx() {
    if (window.innerWidth >= 720) return 200;
    if (window.innerHeight <= 700) return 142;
    return 164;
  }

  function applyFace() {
    var h = facePx();
    document.documentElement.style.setProperty("--face", h + "px");
    return h;
  }

  function later(fn, ms) {
    var id = setTimeout(fn, ms);
    timers.push(id);
    return id;
  }

  function clearTimers() {
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers = [];
    countRun++;
  }

  function setPhase(next) {
    phase = next;
    $("app").setAttribute("data-phase", next);
  }

  function setGoal(text, kind) {
    $("goal").textContent = text;
    $("goal").className = "goal" + (kind ? " " + kind : "");
  }

  function setStreakNumber(n) {
    var el = $("streakNum");
    var text = el.firstChild;
    if (!text || text.nodeType !== 3) {
      text = document.createTextNode("");
      el.insertBefore(text, el.firstChild);
    }
    text.nodeValue = String(n);
  }

  function shelfHTML() {
    var html = "";
    var next = null;
    var i;
    for (i = 0; i < TIERS.length; i++) {
      var t = TIERS[i];
      if (t.id === "pond" || state.hats.indexOf(t.id) >= 0) {
        html += '<figure>' + duckSVG(t) + "<figcaption>" + t.name + "</figcaption></figure>";
      } else if (!next) next = t;
    }
    if (next) html += '<figure class="ghost">' + duckSVG(next) + "<figcaption>" + next.name + "</figcaption></figure>";
    return html;
  }

  function renderChrome() {
    var tier = tierAt(state.streak);
    setStreakNumber(state.streak);
    $("mult").textContent = "\u00d7" + tier.mult;
    $("mult").hidden = tier.mult <= 1;
    $("streakDuck").innerHTML = duckSVG(tier);
    $("streakLabel").textContent = "in a row \u00b7 best " + state.best;
    $("bankNum").textContent = String(state.bank);
    $("bankDuck").innerHTML = duckSVG(TIERS[0]);
    $("best").textContent = String(state.best);
    $("startBank").textContent = String(state.bank);
    $("hatCount").textContent = String(state.hats.length);
    $("startShelf").innerHTML = shelfHTML();
    $("sheetShelf").innerHTML = shelfHTML();
    $("sheetText").textContent = "Best streak " + state.best + " \u00b7 " + state.bank + " golden ducks. Hats stay when a streak rests. " + levelBlurb();
    $("levelNote").textContent = levelBlurb();
    if (state.streak > 0) {
      $("lede").textContent = "A streak of " + state.streak + " is waiting.";
      $("play").textContent = "Keep spinning!";
    } else {
      $("lede").textContent = "Spin the ducks. Tap how many.";
      $("play").textContent = "Spin!";
    }
    $("startGoal").textContent = state.streak > 0 ? nextGoal(state.streak) : "New hats appear as the streak grows.";
    $("hint").hidden = state.solved > 2 || phase === "count" || phase === "celebrate" || phase === "spin" || phase === "story";
    $("hint").textContent = "Tap each duck to count, then tap the number.";
  }

  function renderSound() {
    var b = $("mute");
    b.textContent = soundOn ? "Sound" : "Muted";
    b.setAttribute("aria-label", soundOn ? "Sound on" : "Sound muted");
    b.setAttribute("aria-pressed", soundOn ? "true" : "false");
  }

  function renderStartFaces() {
    var tier = TIERS[0];
    $("startA").innerHTML = faceHTML(2, tier, false);
    $("startOp").innerHTML = opFace("+");
    $("startB").innerHTML = faceHTML(2, tier, false);
  }

  function setCabinet(kind) {
    $("cabinet").className = "cabinet" + (kind ? " is-" + kind : "");
  }

  function renderChoices(mode, pick) {
    var nButtons = choices.length || 3;
    var list = mode === "lock" ? [] : choices;
    var i;
    if (mode === "lock") {
      for (i = 0; i < nButtons; i++) list.push("\u00b7");
    }
    $("answers").className = "answers n" + list.length;
    $("answers").hidden = false;
    var html = "";
    for (i = 0; i < list.length; i++) {
      var n = list[i];
      var cls = "choice c" + (i % 4);
      var disabled = mode !== "play";
      if (mode === "play") cls += " popin";
      if (mode === "result") {
        if (n === problem.answer) cls += " is-yes";
        else if (n === pick) cls += " is-mist";
        else cls += " is-dim";
      }
      var label = mode === "lock" ? "Wait" : String(n);
      html += '<button class="' + cls + '" type="button" data-n="' + (mode === "lock" ? "" : n) + '"' +
        (disabled ? " disabled" : "") + ' aria-label="' + label + '">' + (mode === "lock" ? "\u00b7" : n) + "</button>";
    }
    $("answers").innerHTML = html;
  }

  function snapStrips() {
    var strip = $("stripAdd");
    if (!strip || $("reels").hidden) return;
    var h = applyFace();
    var faces = strip.children.length;
    if (!faces) return;
    strip.style.animation = "none";
    strip.style.transform = "translateY(" + (-(faces - 1) * h) + "px)";
  }

  var askedAt = 0;
  var tapN = 0;

  function resetTaps() {
    tapN = 0;
    var buttons = document.querySelectorAll(".duckbtn");
    var i;
    for (i = 0; i < buttons.length; i++) {
      buttons[i].classList.remove("lit");
      var badge = buttons[i].querySelector("em");
      if (badge) buttons[i].removeChild(badge);
    }
    $("recount").hidden = true;
  }

  function countTap(btn) {
    if (!btn || btn.classList.contains("lit") || btn.classList.contains("swimaway") || btn.classList.contains("gone")) return;
    if (btn.disabled) return;
    tapN++;
    btn.classList.add("lit");
    btn.insertAdjacentHTML("beforeend", "<em>" + tapN + "</em>");
    speak(word(tapN));
    playCountBlip(tapN - 1);
    $("recount").hidden = false;
  }

  function setStory(name) {
    if (name) $("cabinet").setAttribute("data-story", name);
    else $("cabinet").removeAttribute("data-story");
  }

  function spinStrip(strip, count, duration) {
    var h = facePx();
    var to = -((count - 1) * h);
    strip.style.animation = "none";
    strip.style.transform = "translateY(0)";
    if (reduceMotion || duration <= 0) {
      strip.style.transform = "translateY(" + to + "px)";
      return;
    }
    strip.style.setProperty("--to", to + "px");
    void strip.offsetWidth;
    strip.style.animation = "reelSpin " + duration + "ms cubic-bezier(.12,.72,.18,1) forwards";
  }

  function noteAnswer(ok, ms) {
    var entry = { ok: !!ok, slow: isSlow(ms, problem.maxSum) };
    var result;
    if (problem.track === "sub") {
      state.subLog.push(entry);
      if (state.subLog.length > 40) state.subLog = state.subLog.slice(-40);
      result = consider(state.subLog, state.subLevel, 0, SUB_LADDER.length - 1, state.subMark, state.subCooldown);
      state.subLevel = result.level;
      state.subMark = result.mark;
      state.subCooldown = result.cooldown;
    } else {
      state.addLog.push(entry);
      if (state.addLog.length > 40) state.addLog = state.addLog.slice(-40);
      result = consider(state.addLog, state.addLevel, 0, ADD_LADDER.length - 1, state.addMark, state.addCooldown);
      state.addLevel = result.level;
      state.addMark = result.mark;
      state.addCooldown = result.cooldown;
      if (state.addLevel >= SUB_UNLOCK_AT) state.subUnlocked = true;
    }
  }

  function spin() {
    clearTimers();
    quietSpeech();
    pendingSpin = false;
    resetTaps();
    setStory("");
    setPhase("spin");
    $("again").hidden = true;
    $("recount").hidden = true;
    $("countpond").hidden = true;
    $("countpond").innerHTML = "";
    $("sumline").className = "sumline";
    $("caption").className = "caption";
    setCabinet("spin");
    applyFace();
    var built = window.DuckMath.buildProblem(state, lastKey);
    lastKey = built.key;
    problem = built.problem;
    problem.tier = tierAt(state.streak);
    save();
    choices = makeChoices(problem.answer, choiceCount(problem.maxSum, problem.track));
    setGoal(nextGoal(state.streak), "");
    if (problem.track === "sub") { startStory(); return; }
    $("pond").hidden = true;
    $("reels").hidden = false;
    $("answers").hidden = false;
    var tier = problem.tier;
    var decoys = 6;
    var html = "";
    var i;
    var samples = [[1, 1], [1, 2], [2, 1], [2, 2], [1, 3], [3, 1]];
    for (i = 0; i < decoys; i++) {
      var sample = samples[i % samples.length];
      html += wideFace(sample[0], sample[1], tier, false);
    }
    html += wideFace(problem.a, problem.b, tier, true);
    $("stripAdd").innerHTML = html;
    $("caption").textContent = captionFor(problem);
    $("sumline").textContent = equationFor(problem, null);
    renderChoices("lock");
    var dur = reduceMotion ? 0 : 880;
    spinStrip($("stripAdd"), decoys + 1, dur);
    if (!reduceMotion) {
      var ticks = 0;
      var tickTimer = function () {
        if (phase !== "spin") return;
        playTick();
        ticks++;
        if (ticks * 80 < dur) later(tickTimer, 80);
      };
      tickTimer();
    }
    later(landed, dur + (reduceMotion ? 20 : 40));
  }

  function startStory() {
    $("reels").hidden = true;
    $("pond").hidden = false;
    $("answers").hidden = true;
    var html = "";
    var i;
    for (i = 0; i < problem.a; i++) {
      html += '<button type="button" class="duckbtn bob" data-i="' + i + '">' + duckSVG(problem.tier) + "</button>";
    }
    $("pondDucks").innerHTML = html;
    $("caption").textContent = plural(problem.a, "duck") + (problem.a === 1 ? " is swimming." : " are swimming.");
    $("sumline").textContent = String(problem.a);
    setStory("swimming");
    speak(word(problem.a) + (problem.a === 1 ? " duck is swimming." : " ducks are swimming."));
    later(function () {
      if (phase !== "spin" && phase !== "story") return;
      setPhase("story");
      var ducks = $("pondDucks").querySelectorAll(".duckbtn");
      var k;
      for (k = problem.answer; k < ducks.length; k++) ducks[k].classList.add(reduceMotion ? "gone" : "swimaway");
      setStory("leaving");
      var leaveLine = problem.b === 1 ? "One swims away." : word(problem.b) + " swim away.";
      $("caption").textContent = leaveLine;
      speak(leaveLine);
      playPoof();
    }, reduceMotion ? 280 : 1100);
    later(function () {
      if (phase !== "spin" && phase !== "story") return;
      var gone = $("pondDucks").querySelectorAll(".swimaway");
      var g;
      for (g = 0; g < gone.length; g++) gone[g].classList.add("gone");
      setPhase("answer");
      setStory("ask");
      setCabinet("");
      $("caption").className = "caption ask";
      $("caption").textContent = "How many ducks are left?";
      $("sumline").textContent = problem.showMinus ? equationFor(problem, null) : "?";
      $("answers").hidden = false;
      renderChoices("play");
      speak(speechFor(problem));
      askedAt = Date.now();
      $("live").textContent = "How many ducks are left?";
    }, reduceMotion ? 520 : 2300);
  }

  function landed() {
    if (phase !== "spin") return;
    setPhase("answer");
    setCabinet("");
    playDing();
    renderChoices("play");
    var line = speechFor(problem);
    $("live").textContent = captionFor(problem);
    speak(line);
    askedAt = Date.now();
    var buttons = $("answers").querySelectorAll("button");
    var i;
    for (i = 0; i < buttons.length; i++) buttons[i].style.animationDelay = (i * 0.04) + "s";
  }

  function choose(n) {
    if (phase !== "answer") return;
    if (isNaN(n)) return;
    var ms = askedAt ? Date.now() - askedAt : 0;
    noteAnswer(n === problem.answer, ms);
    initAudio();
    if (n === problem.answer) win();
    else miss(n);
  }

  function cheerText(reward) {
    if (reward.jack && reward.hat) return "Golden jackpot! " + reward.tier.name + " ducks";
    if (reward.jack) return "Golden jackpot!";
    if (reward.hat) return "New hat! " + reward.tier.name + " ducks";
    return "Yes! " + plural(problem.answer, "duck");
  }

  function win() {
    quietSpeech();
    var prev = state.streak;
    state.streak = prev + 1;
    if (state.streak > state.best) state.best = state.streak;
    var reward = rewardFor(prev, state.streak, state.hats);
    state.bank += reward.total;
    if (reward.hat) state.hats.push(reward.hat);
    state.solved += 1;
    save();
    setPhase("celebrate");
    renderChoices("result", problem.answer);
    renderChrome();
    pulse($("streakNum"), "pop");
    floatPlus(reward.total);
    var kind = reward.jack ? "jackpot" : "win";
    setCabinet(kind);
    setGoal(cheerText(reward), reward.jack ? "jack" : "yes");
    $("sumline").textContent = equationFor(problem, problem.answer);
    $("live").textContent = cheerText(reward);
    if (reward.jack) playJackpot();
    else if (reward.hat) playHat();
    else playCorrect();
    if (navigator.vibrate) { try { navigator.vibrate(reward.jack ? [20, 40, 20] : 18); } catch (e) {} }
    shower(reward.jack ? "jackpot" : reward.hat ? "hat" : "win", reward.tier);
    var delay = reward.jack ? 2800 : reward.hat ? 2200 : 1500;
    if (reduceMotion) delay = 700;
    later(function () {
      if (!$("sheet").hidden) { pendingSpin = true; return; }
      spin();
    }, delay);
  }

  function miss(pick) {
    var prev = state.streak;
    var rested = dropStreak(prev);
    state.streak = rested;
    save();
    quietSpeech();
    setPhase("count");
    renderChoices("result", pick);
    renderChrome();
    if (rested !== prev) pulse($("streakNum"), "rest");
    setCabinet("miss");
    playPoof();
    var note = rested !== prev ? " Streak rests at " + rested + "." : "";
    var lead = problem.track === "sub" ? "Let's count the ducks still here." : "Let's count.";
    setGoal(lead + note, "soft");
    speak("Let's count.");
    $("live").textContent = lead;
    $("again").hidden = false;
    $("recount").hidden = true;
    $("sumline").className = "sumline counting";
    if (problem.showMinus) $("sumline").textContent = equationFor(problem, "\u2026");
    else if (problem.track === "sub") $("sumline").textContent = "?";
    else $("sumline").textContent = equationFor(problem, "\u2026");
    runCount();
  }

  function runCount() {
    var run = countRun;
    var tier = problem.tier;
    $("reels").hidden = true;
    $("pond").hidden = false;
    var html = "";
    var i;
    for (i = 0; i < problem.answer; i++) {
      html += '<button type="button" class="duckbtn" disabled>' + duckSVG(tier) + "</button>";
    }
    if (!problem.answer) html = '<div class="zero">0</div>';
    $("pondDucks").innerHTML = html;
    var nodes = $("pondDucks").querySelectorAll(".duckbtn");
    var step = reduceMotion ? 0 : 240;
    function mark(index, num) {
      var el = nodes[index];
      if (!el) return;
      el.classList.add("lit");
      if (!el.querySelector("em")) el.insertAdjacentHTML("beforeend", "<em>" + num + "</em>");
    }
    function numberThem() {
      if (countRun !== run || phase !== "count") return;
      if (!problem.answer) { finishCount(run); return; }
      if (step === 0) {
        var n;
        for (n = 0; n < problem.answer; n++) mark(n, n + 1);
        finishCount(run);
        return;
      }
      var cursor = 0;
      function one() {
        if (countRun !== run || phase !== "count") return;
        if (cursor >= problem.answer) { finishCount(run); return; }
        mark(cursor, cursor + 1);
        speak(word(cursor + 1));
        playCountBlip(cursor);
        cursor++;
        later(one, step);
      }
      one();
    }
    later(numberThem, reduceMotion ? 0 : 200);
  }

  function finishCount(run) {
    if (countRun !== run || phase !== "count") return;
    var line = problem.track === "sub"
      ? "That's " + plural(problem.answer, "duck") + " left."
      : "That's " + plural(problem.answer, "duck") + ".";
    if (problem.showMinus) $("sumline").textContent = equationFor(problem, problem.answer);
    else $("sumline").textContent = String(problem.answer);
    var rested = state.streak;
    var extra = "";
    if ($("goal").textContent.indexOf("rests") !== -1) extra = " Streak rests at " + rested + ".";
    setGoal(line + extra, "soft");
    speak(line);
    $("live").textContent = line;
  }

  function floatPlus(n) {
    var el = document.createElement("span");
    el.className = "floater";
    el.textContent = "+" + n;
    $("bankBtn").appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1200);
  }

  function pulse(el, cls) {
    el.classList.remove("pop");
    el.classList.remove("rest");
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function shower(kind, tier) {
    if (reduceMotion) return;
    var ducksN = kind === "jackpot" ? 24 : kind === "hat" ? 14 : 9;
    var coins = kind === "jackpot" ? 18 : kind === "hat" ? 10 : 7;
    var i;
    for (i = 0; i < ducksN; i++) spawnFall(duckSVG(tier), 1.5 + Math.random() * 0.9, Math.random() * 0.35);
    for (i = 0; i < coins; i++) spawnFall('<i class="coin"></i>', 1.3 + Math.random() * 0.8, Math.random() * 0.4);
  }

  function spawnFall(html, dur, delay) {
    var el = document.createElement("div");
    el.className = "faller";
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = dur + "s";
    el.style.animationDelay = delay + "s";
    el.innerHTML = html;
    $("fx").appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, (dur + delay) * 1000 + 200);
  }

  function openSheet() {
    $("sheet").hidden = false;
    renderChrome();
  }

  function closeSheet() {
    $("sheet").hidden = true;
    if (pendingSpin && phase === "celebrate") spin();
  }

  function begin() {
    if (phase === "spin" || phase === "celebrate" || phase === "answer" || phase === "count" || phase === "story") return;
    initAudio();
    try { if (window.speechSynthesis) window.speechSynthesis.resume(); } catch (e) {}
    playTap();
    setPhase("spin");
    $("start").hidden = true;
    $("stage").hidden = false;
    renderChrome();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { spin(); });
    });
  }

  function resetAll() {
    if (!window.confirm("Reset saved streaks, hats, golden ducks, and the adding level on this device?")) return;
    state = fresh();
    lastKey = "";
    save();
    renderChrome();
    renderStartFaces();
    playTap();
  }

  function closestButton(node) {
    while (node && node !== document) {
      if (node.tagName === "BUTTON") return node;
      node = node.parentNode;
    }
    return null;
  }

  function onResize() {
    applyFace();
    if (phase === "answer" || phase === "celebrate" || phase === "count" || phase === "spin") {
      if (phase !== "spin") snapStrips();
    }
  }

  $("play").addEventListener("click", begin);
  $("again").addEventListener("click", function () {
    if (phase !== "count") return;
    initAudio();
    playTap();
    spin();
  });
  $("answers").addEventListener("click", function (e) {
    var btn = closestButton(e.target);
    if (!btn || btn.disabled) return;
    choose(parseInt(btn.getAttribute("data-n"), 10));
  });
  $("mute").addEventListener("click", function () {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off"); } catch (e) {}
    if (!soundOn) quietSpeech();
    renderSound();
    if (soundOn) { initAudio(); playTap(); }
  });
  $("recount").addEventListener("click", function () { resetTaps(); });
  $("cabinet").addEventListener("click", function (e) {
    var btn = closestButton(e.target);
    if (!btn || !btn.classList.contains("duckbtn")) return;
    if (phase !== "answer") return;
    countTap(btn);
  });
  $("bankBtn").addEventListener("click", openSheet);
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheet").addEventListener("click", function (e) { if (e.target === $("sheet")) closeSheet(); });
  $("reset").addEventListener("click", resetAll);
  window.addEventListener("resize", onResize);

  try { soundOn = localStorage.getItem(SOUND_KEY) !== "off"; } catch (e2) { soundOn = true; }
  state = load();
  applyFace();
  $("startBulbs").innerHTML = bulbHTML();
  $("playBulbs").innerHTML = bulbHTML();
  renderSound();
  renderStartFaces();
  renderChrome();

  window.DuckMath = {
    ADAPT: {
      WINDOW: ADAPT_WINDOW, TARGET: ADAPT_TARGET, MIN_SAMPLES: ADAPT_MIN_SAMPLES,
      MISS_SPAN: ADAPT_MISS_SPAN, MISS_DROP: ADAPT_MISS_DROP,
      SLOW_SPAN: ADAPT_SLOW_SPAN, SLOW_DROP: ADAPT_SLOW_DROP,
      FLUENT: ADAPT_FLUENT
    },
    ADD_LADDER: ADD_LADDER,
    SUB_LADDER: SUB_LADDER,
    ADD_START: ADD_START,
    SUB_UNLOCK_AT: SUB_UNLOCK_AT,
    SUB_SIGN_AT: SUB_SIGN_AT,
    buildProblem: buildProblem,
    additionPairs: additionPairs,
    makeChoices: makeChoices,
    choiceCount: choiceCount,
    consider: consider,
    isSlow: isSlow,
    dropStreak: dropStreak,
    tierAt: tierAt,
    nextGoal: nextGoal,
    rewardFor: rewardFor,
    getState: function () {
      return {
        best: state.best, streak: state.streak, bank: state.bank, solved: state.solved,
        hats: state.hats.slice(), addLevel: state.addLevel, subLevel: state.subLevel,
        subUnlocked: state.subUnlocked, sinceSub: state.sinceSub,
        addLog: state.addLog.slice(), subLog: state.subLog.slice(),
        addMark: state.addMark, subMark: state.subMark,
        addCooldown: state.addCooldown, subCooldown: state.subCooldown
      };
    },
    setState: function (p) {
      if (!p) return;
      if (p.best != null) state.best = p.best;
      if (p.streak != null) state.streak = p.streak;
      if (p.bank != null) state.bank = p.bank;
      if (p.solved != null) state.solved = p.solved;
      if (p.hats) state.hats = p.hats.slice();
      if (p.addLevel != null) state.addLevel = p.addLevel;
      if (p.subLevel != null) state.subLevel = p.subLevel;
      if (p.subUnlocked != null) state.subUnlocked = !!p.subUnlocked;
      if (p.sinceSub != null) state.sinceSub = p.sinceSub;
      if (p.addLog) state.addLog = p.addLog.slice();
      if (p.subLog) state.subLog = p.subLog.slice();
      if (p.addMark != null) state.addMark = p.addMark;
      if (p.subMark != null) state.subMark = p.subMark;
      if (p.addCooldown != null) state.addCooldown = p.addCooldown;
      if (p.subCooldown != null) state.subCooldown = p.subCooldown;
      if (state.best < state.streak) state.best = state.streak;
      save();
      renderChrome();
      renderStartFaces();
    },
    getPhase: function () { return phase; }
  };
})();
</script>
</body>
</html>
